    <script>
      // SPA fallback for GitHub Pages: 404.html sends deep links here as ?/path
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
